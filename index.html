<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: sticky sportsbook header with tabs; one workspace per tab; markets left, bet slip right. Single dark "court at night" look. */
  --bg:#0a0f1c; --panel:#111a2e; --panel-2:#17233d; --line:#26375c;
  --fg:#e9eefa; --muted:#8d9ec2; --accent:#3d96f5; --accent-ink:#04101f; --brand:#ee3b5b;
  --win:#35d08a; --loss:#ff6272; --push:#f2b84b;
  --s0:#4aa3ff; --s1:#ff6f86; --s2:#f2b84b; --s3:#35d08a;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);
  padding-block:0 5rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
h2{font-size:1.7rem;line-height:1.1}
h3{font-size:1.2rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.odd b,.big{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.wrap{max-width:1240px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.25rem;padding-top:.7rem}
.brand{display:flex;align-items:baseline;gap:.6rem}
.brand .word{font-family:var(--display);font-weight:700;font-size:1.9rem;letter-spacing:.12em;line-height:1}
.brand .word i{font-style:normal;color:var(--brand)}
.brand .sub{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bal{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.3rem .8rem;text-align:right;line-height:1.1}
.bal small{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bal b{font-family:var(--display);font-size:1.35rem;font-weight:600;letter-spacing:.03em}
nav.tabs{flex:1 1 100%;display:flex;gap:.15rem;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:.5rem .85rem .45rem;font-family:var(--display);font-weight:600;font-size:1.08rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-top:1.25rem;display:flex;flex-direction:column;gap:1.75rem}

/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:1rem}
.sec{display:flex;flex-direction:column;gap:.75rem}
.sec>header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.25rem .75rem}
.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:.5rem .95rem;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.danger{background:var(--loss);color:#1c0509}
.btn.sm{padding:.25rem .6rem;font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.pill{display:inline-block;font-family:var(--display);font-weight:600;letter-spacing:.08em;font-size:.8rem;padding:.05rem .5rem;border-radius:5px;border:1px solid currentColor;text-transform:uppercase}
.pill.win{color:var(--win)}.pill.loss{color:var(--loss)}.pill.push{color:var(--push)}.pill.pend{color:var(--muted)}
.tag{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:.05rem .4rem;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.warn{color:var(--push);border-color:var(--push)}
.tag.ok{color:var(--win);border-color:var(--win)}
.tag.man{color:var(--accent);border-color:var(--accent)}
.pos{color:var(--win)}.neg{color:var(--loss)}
.empty{color:var(--muted);padding:1rem 0}
label{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
input[type=text],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:.45rem .6rem;min-width:0;width:100%}
input[type=text]:focus,select:focus,textarea:focus,input[type=date]:focus{border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;color:var(--muted)}
td.n,th.n{text-align:right}
tr.sel td{background:var(--panel-2)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel-2)}

/* next matchup */
.next{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem 2rem;border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:10px;padding:1rem 1.25rem;background:linear-gradient(100deg,var(--panel-2),var(--panel))}
.vs{display:flex;align-items:baseline;gap:.75rem;font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1;letter-spacing:.04em}
.vs i{font-style:normal;font-size:1.1rem;color:var(--muted);font-weight:500}
.next-r{display:flex;flex-direction:column;gap:.25rem;min-width:min(100%,280px)}
.hist{font-size:.85rem;color:var(--muted);margin-top:.35rem}

/* player card */
.pcard{display:flex;gap:1rem;align-items:center}
.avatar{flex:none;width:68px;height:68px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:2rem;letter-spacing:.04em}
.pcard h3{font-size:1.7rem;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.45rem}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem;color:var(--muted)}
.chip b{color:var(--fg);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.75rem 1rem}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kv b{font-family:var(--display);font-size:1.5rem;font-weight:600;letter-spacing:.02em}
.big{font-family:var(--display);font-weight:700;font-size:2.8rem;line-height:1;letter-spacing:.02em}

/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:1rem}
figure.chart{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.8rem .9rem}
figure.chart figcaption{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.4rem;font-family:var(--display);font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin-bottom:.4rem}
figure.chart select{width:auto;padding:.15rem .4rem;font-size:.8rem}
svg.cv{display:block;width:100%;height:auto}
.cv .grid{stroke:var(--line);stroke-width:1}
.cv .ax{fill:var(--muted);font:11.5px var(--body)}
.cv .ref{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1}
.cv .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.cv .lbl{font:600 12px var(--body)}
.legend{display:flex;gap:1rem;font-size:.78rem;color:var(--muted);margin-bottom:.2rem}
.legend i{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;margin-right:.3rem;vertical-align:-1px}

/* sportsbook */
.book{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:1.5rem;align-items:start}
.markets{display:flex;flex-direction:column;gap:1.5rem;min-width:0}
.mgroup>header{border-bottom:2px solid var(--line);padding-bottom:.35rem;margin-bottom:.1rem}
.mgroup>header p{font-size:.8rem;color:var(--muted);margin-top:.15rem}
.mrow{display:grid;grid-template-columns:minmax(120px,1.1fr) 168px minmax(0,1fr) minmax(0,1fr);gap:.4rem .7rem;align-items:center;padding:.65rem 0;border-bottom:1px solid var(--line)}
.mname{display:flex;flex-direction:column;gap:.2rem;font-weight:600}
.mname .tags{display:flex;flex-wrap:wrap;gap:.25rem}
.lc{display:grid;grid-template-columns:34px 1fr 34px;gap:.25rem}
.lc button{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;font-size:1.1rem;line-height:1}
.lc button:hover{border-color:var(--accent)}
.lc input{text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.odd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05rem;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:.35rem .4rem;min-height:3.1rem;width:100%}
.odd span{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.odd b{font-family:var(--display);font-size:1.25rem;font-weight:600;letter-spacing:.02em}
.odd:hover:not(:disabled){border-color:var(--accent)}
.odd.on{background:var(--accent);border-color:var(--accent)}
.odd.on span,.odd.on b{color:var(--accent-ink)}
.odd:disabled{opacity:.45;cursor:not-allowed}
.minfo{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.2rem 1rem;align-items:center;font-size:.76rem;color:var(--muted)}
.oe{display:grid;grid-template-columns:1fr 1fr auto;gap:.4rem;grid-column:1/-1}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:.76rem;text-decoration:underline}

.slip{position:sticky;top:calc(env(safe-area-inset-top,0px) + 7.2rem);display:flex;flex-direction:column;gap:.75rem;max-height:calc(100vh - 8rem);overflow:auto}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:.4rem;font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.leg{border-top:1px solid var(--line);padding-top:.65rem;display:flex;flex-direction:column;gap:.4rem}
.leg .t{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start}
.leg .t b{font-weight:600}
.leg .x{background:none;border:0;color:var(--muted);font-size:1.2rem;line-height:1;padding:0 .2rem}
.leg .x:hover{color:var(--loss)}
.leg .f{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.sum{display:flex;flex-direction:column;gap:.3rem;border-top:1px solid var(--line);padding-top:.65rem}
.sum div{display:flex;justify-content:space-between;gap:.5rem}
.err{color:var(--loss);font-size:.85rem}
.slipbar{display:none}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:.75rem}
.qtable input{max-width:90px;text-align:center}
.qtable td,.qtable th{padding:.35rem .5rem}
.resbar{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;align-items:center}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:.35rem;align-items:center}
.pair span{color:var(--muted)}

/* bets */
.bet{display:flex;flex-direction:column;gap:.5rem;padding:.8rem 0;border-bottom:1px solid var(--line)}
.bet .h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.4rem .8rem}
.bet ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.25rem}
.bet li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.2rem .8rem;font-size:.9rem}
.bet .f{display:flex;flex-wrap:wrap;gap:.3rem 1.25rem;font-size:.85rem;color:var(--muted)}

/* dialog + toast */
.veil{position:fixed;inset:0;z-index:60;background:rgba(3,6,14,.72);display:grid;place-items:center;padding:1rem}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.25rem;max-width:440px;width:100%;display:flex;flex-direction:column;gap:1rem}
#toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
#toast div{background:var(--fg);color:var(--bg);padding:.5rem .9rem;border-radius:8px;font-weight:500;box-shadow:0 6px 22px rgba(0,0,0,.45)}
.banner{border:1px solid var(--push);color:var(--push);border-radius:8px;padding:.55rem .8rem;font-size:.85rem}

@media (max-width:980px){
  .book{grid-template-columns:minmax(0,1fr)}
  .slip{position:static;max-height:none}
  .slipbar{display:flex;position:fixed;z-index:35;left:0;right:0;bottom:0;justify-content:space-between;align-items:center;gap:.75rem;
    background:var(--accent);color:var(--accent-ink);border:0;font-weight:600;
    padding:.8rem max(16px,env(safe-area-inset-right,0px)) calc(.8rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
}
@media (max-width:700px){
  .mrow{grid-template-columns:1fr 1fr}
  .mname,.lc{grid-column:1/-1}
  .vs{font-size:2rem}
  .brand .sub{display:none}
}
@media (prefers-reduced-motion:no-preference){
  #toast div{animation:rise .2s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
</style>

var KEY='courtside.v1';

 {k:'pra',l:'PRA',kind:'n',sd:6},{k:'pts',l:'PTS',kind:'n',sd:4},{k:'reb',l:'REB',kind:'n',sd:2.5},{k:'ast',l:'AST',kind:'n',sd:2.2},
 {k:'stl',l:'STLS',kind:'c',sd:1},{k:'blk',l:'BLK',kind:'c',sd:.9},{k:'fgm',l:'FG (made)',kind:'c',sd:2.2},{k:'fga',l:'FG attempted',kind:'n',sd:3},
 {k:'tpm',l:'3PTS (made)',kind:'c',sd:1.2},{k:'tpa',l:'3PTS attempted',kind:'c',sd:1.6},{k:'fls',l:'FLS',kind:'c',sd:1.2}];

['my','opp','game','spread'].forEach(function(g){SCOPES.forEach(function(sc){
  MARKETS.push({id:g+':'+sc[0],group:g,key:sc[0],label:sc[1],kind:'n',sd:SDP[g][sc[0]==='full'?0:1],full:sc[0]==='full',quarter:sc[0]!=='full'});});});
MARKETS.forEach(function(m){MK[m.id]=m;});

var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var r1=function(x){return (Math.round(x*10)/10).toFixed(1);};

var am=function(o){return o==null?'—':(o>0?'+'+o:String(o));};
var sgn=function(x){return (x>0?'+':x<0?'−':'')+Math.abs(x);};
var ccFmt=function(x){var v=r2(x);return (Number.isInteger(v)?v.toLocaleString('en-US'):v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}))+' CC';};

var fmtTime=function(t){try{return new Date(t).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return t;}};

/* ---------- state ---------- */
var storageOK=true,state,ui={tab:'dash',perf:'pra',form:null,formErr:'',slipErr:'',dialog:null,oddsEdit:{},raw:{},mt:null,betsFilter:'all',ledFilter:'all',showBackup:false,backupMsg:''};
function defaults(){return {v:1,
 player:{name:'Sebastian Victor',team:'PHI',pos:'',ovr:'',height:'',build:''},
 settings:{start:10000,margin:5,includeOT:false,baseMy:53.9,baseOpp:48.7,baseGames:5},

function load(){try{var raw=localStorage.getItem(KEY);if(raw)return merge(JSON.parse(raw));}catch(e){storageOK=false;}return defaults();}

function playerVal(g,k){var s=g.stats;if(!s)return null;if(k==='pra')return (s.pts==null||s.reb==null||s.ast==null)?null:s.pts+s.reb+s.ast;return s[k]==null?null:s[k];}

 if(st.tpm!=null&&st.tpa!=null&&st.tpm>st.tpa){ui.formErr='3PTS made cannot be more than 3PTS attempted.';return false;}

 if(st.pts!=null&&st.fgm!=null&&st.tpm!=null&&st.pts<2*st.fgm+st.tpm){ui.formErr='Points are too low for the made shots entered (each FG is worth at least 2, plus 1 for each 3).';return false;}
